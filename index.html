<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精靈世界 @HH (完整功能雲端同步版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float-anim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulse-boss {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pixel-sprite {
            image-rendering: pixelated;
            animation: float-anim 3s ease-in-out infinite;
        }
        .boss-sprite {
            animation: pulse-boss 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-indigo-950 min-h-screen text-slate-100 font-sans">
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBG4I2B8hTjbILYFRxeuLKJq4WL49T1KM8",
            authDomain: "hhgame-d252a.firebaseapp.com",
            projectId: "hhgame-d252a",
            storageBucket: "hhgame-d252a.firebasestorage.app",
            messagingSenderId: "914747425373",
            appId: "1:914747425373:web:2c8a64da3b6bbb3ae043b4",
            measurementId: "G-5CX40P1HL3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let memoryCache = {
            users: [],
            pending: [],
            games: [],
            store: []
        };

        let currentView = 'home';
        let activeGame = null;

        const COMPANION_TYPES = {
            water: { name: '水屬性精靈', color: 'from-blue-500 to-cyan-500', icon: '💧' },
            fire: { name: '火屬性精靈', color: 'from-red-500 to-orange-500', icon: '🔥' },
            grass: { name: '草屬性精靈', color: 'from-emerald-500 to-green-500', icon: '🌿' },
            electricity: { name: '電屬性精靈', color: 'from-amber-400 to-yellow-500', icon: '⚡' },
            ice: { name: '冰屬性精靈', color: 'from-sky-300 to-indigo-500', icon: '❄️' }
        };

        function getDefaultGames() {
            return [
                { id: 1, title: '魔法方塊冒險', html: '<div style="background:linear-gradient(135deg,#6366f1,#ec4899);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:sans-serif;text-align:center;"><h1>✨ 魔法方塊冒險 ✨</h1><p style="margin:10px 0;">點擊下方按鈕賺取冒險積分！</p><button onclick="parent.earnGamePoints(50)" style="padding:16px 32px;background:#fbbf24;color:#000;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:18px;">獲得 50 積分</button></div>', playCount: 42 }
            ];
        }

        function getDefaultStore() {
            return [
                { id: 1, name: '藍色帽子', slot: 'hat', price: 500, icon: '🧢' },
                { id: 2, name: '黃色帽子', slot: 'hat', price: 500, icon: '👒' },
                { id: 3, name: '黑色墨鏡', slot: 'glasses', price: 600, icon: '🕶️' },
                { id: 5, name: '紅色T恤', slot: 'shirt', price: 800, icon: '👕' },
                { id: 11, name: '紅色褲子', slot: 'pants', price: 700, icon: '👖' },
                { id: 23, name: '綠色背包', slot: 'handheld', price: 1000, icon: '🎒' }
            ];
        }

        function initCloudDB() {
            const initialUsers = [
                { id: 1, username: 'adminamy', password: 'chh2526122', role: 'admin', points: 999999, gender: 'girl', companions: [{ type: 'fire', exp: 1, weapon: null }], inventory: [1,3,5,11,23], equipped: {}, background: '', friends: [], friendRequests: [] }
            ];
            set(ref(db, 'hh_data'), {
                users: initialUsers,
                pending: [],
                games: getDefaultGames(),
                store: getDefaultStore()
            });
        }

        window.CloudDB = {
            getUsers() { return memoryCache.users; },
            saveUsers(users) { set(ref(db, 'hh_data/users'), users); },
            getPending() { return memoryCache.pending; },
            savePending(list) { set(ref(db, 'hh_data/pending'), list); },
            getGames() { return memoryCache.games; },
            saveGames(games) { set(ref(db, 'hh_data/games'), games); },
            getStore() { return memoryCache.store; },
            getSession() {
                const u = localStorage.getItem('hh_session');
                if (!u) return null;
                let session = JSON.parse(u);
                const users = CloudDB.getUsers();
                const latest = users.find(x => x.id === session.id);
                if (latest) session = latest;
                if (session.role === 'admin' || session.username === 'adminamy') session.points = 999999;
                return session;
            },
            setSession(user) {
                if (user.role === 'admin' || user.username === 'adminamy') user.points = 999999;
                localStorage.setItem('hh_session', JSON.stringify(user));
                updateUserInDB(user);
            },
            clearSession() {
                localStorage.removeItem('hh_session');
            }
        };

        function updateUserInDB(sessionUser) {
            let users = CloudDB.getUsers();
            if (sessionUser.role === 'admin' || sessionUser.username === 'adminamy') sessionUser.points = 999999;
            const idx = users.findIndex(x => x.id === sessionUser.id);
            if (idx !== -1) {
                users[idx] = sessionUser;
                set(ref(db, 'hh_data/users'), users);
            }
        }

        function render() {
            const appDiv = document.getElementById('app');
            if (!appDiv) return;
            const session = CloudDB.getSession();
            if (!session && currentView !== 'register' && currentView !== 'pending') currentView = 'login';

            if (!session) {
                appDiv.innerHTML = currentView === 'register' ? renderRegister() : renderLogin();
                return;
            }

            if (activeGame) {
                appDiv.innerHTML = renderGamePlayer();
                return;
            }

            let html = renderNavbar(session) + '<div class="max-w-6xl mx-auto p-6">';
            if (currentView === 'home') html += renderHome(session);
            else if (currentView === 'library') html += renderLibrary();
            else if (currentView === 'homeland') html += renderHomeland(session);
            else if (currentView === 'castle') html += renderCastle(session);
            else if (currentView === 'store') html += renderStore(session);
            else if (currentView === 'ranking') html += renderRanking();
            else if (currentView === 'friends') html += renderFriends(session);
            else if (currentView === 'admin' && session.role === 'admin') html += renderAdmin();
            html += '</div>';
            appDiv.innerHTML = html;
        }

        function renderNavbar(session) {
            return `
                <nav class="bg-slate-950/90 backdrop-blur-md shadow-xl sticky top-0 z-50 px-6 py-4 flex justify-between items-center rounded-b-3xl mx-4 mt-2 border-b-2 border-pink-500/30">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-black bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">精靈世界 @HH</span>
                        <span class="bg-purple-950 text-purple-200 text-xs px-3 py-1 rounded-full font-bold">玩家：${session.username}</span>
                        <span class="bg-amber-950 text-amber-200 text-xs px-3 py-1 rounded-full font-bold">⭐ ${session.role === 'admin' ? '無限' : session.points} 點</span>
                    </div>
                    <div class="flex gap-4 font-bold text-sm items-center">
                        <button onclick="window.navTo('home')" class="hover:text-pink-400 transition">首頁</button>
                        <button onclick="window.navTo('library')" class="hover:text-pink-400 transition">遊戲中心</button>
                        <button onclick="window.navTo('homeland')" class="hover:text-pink-400 transition">家園與衣櫥</button>
                        <button onclick="window.navTo('castle')" class="hover:text-pink-400 transition">城堡挑戰</button>
                        <button onclick="window.navTo('store')" class="hover:text-pink-400 transition">服裝商店</button>
                        <button onclick="window.navTo('ranking')" class="hover:text-pink-400 transition">排行榜</button>
                        <button onclick="window.navTo('friends')" class="hover:text-pink-400 transition">好友</button>
                        ${session.role === 'admin' ? '<button onclick="window.navTo(\'admin\')" class="text-pink-400 font-black">管理員工作室</button>' : ''}
                        <button onclick="window.logout()" class="text-slate-400">登出</button>
                    </div>
                </nav>
            `;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-4">
                    <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-pink-500/40 space-y-6">
                        <h1 class="text-3xl font-black text-center text-pink-400">精靈世界 @HH (雲端版)</h1>
                        <input id="login-user" type="text" placeholder="帳號" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white outline-none">
                        <input id="login-pass" type="password" placeholder="密碼" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white outline-none">
                        <button onclick="window.handleLogin()" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 font-black rounded-2xl text-white">登入</button>
                        <button onclick="window.currentView='register'; window.renderApp();" class="w-full py-3 bg-slate-800 font-bold rounded-2xl text-slate-300">註冊帳號</button>
                    </div>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-purple-500/40 space-y-4">
                        <h1 class="text-2xl font-black text-center text-pink-400">註冊帳號 (需管理員審核)</h1>
                        <input id="reg-user" type="text" placeholder="帳號" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white outline-none">
                        <input id="reg-pass" type="password" placeholder="密碼" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white outline-none">
                        <div class="flex gap-4">
                            <label class="flex-1 border-2 border-slate-800 p-3 rounded-2xl text-center cursor-pointer font-bold bg-slate-950"><input type="radio" name="reg-gender" value="boy"> 男生</label>
                            <label class="flex-1 border-2 border-slate-800 p-3 rounded-2xl text-center cursor-pointer font-bold bg-slate-950"><input type="radio" name="reg-gender" value="girl" checked> 女生</label>
                        </div>
                        <select id="reg-companion" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white outline-none">
                            <option value="water">水屬性精靈</option>
                            <option value="fire">火屬性精靈</option>
                            <option value="grass">草屬性精靈</option>
                            <option value="electricity">電屬性精靈</option>
                            <option value="ice">冰屬性精靈</option>
                        </select>
                        <button onclick="window.handleRegister()" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 font-black rounded-2xl text-white">送出申請</button>
                        <button onclick="window.currentView='login'; window.renderApp();" class="w-full py-3 text-slate-400 font-bold">返回登入</button>
                    </div>
                </div>
            `;
        }

        function renderHome(session) {
            return `
                <div class="space-y-8 text-center py-6">
                    <h1 class="text-4xl font-black bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">歡迎回來，${session.username}！</h1>
                    <p class="text-slate-300 font-bold">雲端同步與所有精靈養成功能全面正常運作中！</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div onclick="window.navTo('homeland')" class="bg-slate-900 p-6 rounded-3xl border-2 border-purple-500/40 cursor-pointer hover:scale-105 transition">
                            <div class="text-4xl mb-2">🏡</div>
                            <h3 class="text-xl font-black text-pink-400">家園與精靈養成</h3>
                            <p class="text-xs text-slate-400 mt-1">照顧精靈、升級進化、穿搭衣櫥</p>
                        </div>
                        <div onclick="window.navTo('castle')" class="bg-slate-900 p-6 rounded-3xl border-2 border-red-500/40 cursor-pointer hover:scale-105 transition">
                            <div class="text-4xl mb-2">🏰</div>
                            <h3 class="text-xl font-black text-red-400">城堡 Boss 挑戰</h3>
                            <p class="text-xs text-slate-400 mt-1">擊敗強敵贏取豐厚獎勵</p>
                        </div>
                        <div onclick="window.navTo('store')" class="bg-slate-900 p-6 rounded-3xl border-2 border-amber-500/40 cursor-pointer hover:scale-105 transition">
                            <div class="text-4xl mb-2">🛍️</div>
                            <h3 class="text-xl font-black text-amber-400">服裝商店</h3>
                            <p class="text-xs text-slate-400 mt-1">購買帽子、服裝與配件</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLibrary() {
            const games = CloudDB.getGames();
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-black text-white">🎮 遊戲中心</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${games.map(g => `
                            <div class="bg-slate-900 p-6 rounded-3xl border-2 border-slate-800 flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-black text-pink-400">${g.title}</h2>
                                    <p class="text-xs text-slate-400 mt-1">遊玩次數: ${g.playCount}</p>
                                </div>
                                <button onclick="window.playGame(${g.id})" class="px-6 py-3 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black rounded-2xl">開始遊玩</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderHomeland(session) {
            const comp = session.companions[0] || { type: 'fire', exp: 1 };
            const typeInfo = COMPANION_TYPES[comp.type] || COMPANION_TYPES.fire;
            const tier = Math.min(5, Math.floor(comp.exp / 100) + 1);
            return `
                <div class="space-y-6 text-center">
                    <h1 class="text-3xl font-black text-white">🏡 家園與精靈養成</h1>
                    <div class="bg-slate-900 p-8 rounded-3xl border-4 border-purple-500/40 inline-block space-y-4 max-w-md w-full">
                        <div class="text-7xl pixel-sprite">${typeInfo.icon}</div>
                        <h2 class="text-2xl font-black text-pink-400">${typeInfo.name} (階級 T${tier})</h2>
                        <div class="w-full bg-slate-950 rounded-full h-4 overflow-hidden border border-slate-800">
                            <div class="bg-gradient-to-r from-pink-500 to-purple-500 h-full transition-all" style="width: ${Math.min(100, (comp.exp % 100))}%"></div>
                        </div>
                        <p class="text-slate-300 font-bold">經驗值: ${comp.exp} / 升級所需</p>
                        <button onclick="window.feedCompanion()" class="w-full py-3 bg-emerald-600 text-white font-black rounded-2xl shadow-lg">餵養精靈 (+20 經驗)</button>
                    </div>
                </div>
            `;
        }

        function renderCastle(session) {
            return `
                <div class="space-y-6 text-center">
                    <h1 class="text-3xl font-black text-white">🏰 城堡 Boss 挑戰</h1>
                    <div class="bg-slate-900 p-8 rounded-3xl border-4 border-red-500/40 inline-block space-y-4 max-w-md w-full">
                        <div class="text-7xl boss-sprite">🐉</div>
                        <h2 class="text-2xl font-black text-red-400">黑暗巨龍 Boss</h2>
                        <p class="text-slate-300 font-bold text-sm">挑戰巨龍可獲得大量冒險積分與精靈經驗！</p>
                        <button onclick="window.fightBoss()" class="w-full py-4 bg-gradient-to-r from-red-600 to-amber-600 text-white font-black rounded-2xl shadow-lg">發動城堡攻擊！</button>
                    </div>
                </div>
            `;
        }

        function renderStore(session) {
            const store = CloudDB.getStore();
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-black text-white">🛍️ 服裝商店</h1>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        ${store.map(item => `
                            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-center space-y-2">
                                <div class="text-4xl">${item.icon}</div>
                                <div class="font-black text-white">${item.name}</div>
                                <div class="text-amber-400 font-bold">⭐ ${item.price} 點</div>
                                <button onclick="window.buyItem(${item.id})" class="w-full py-2 bg-pink-600 text-white font-black rounded-xl text-sm">購買</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRanking() {
            const users = CloudDB.getUsers().sort((a,b) => b.points - a.points);
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-black text-white">🏆 精靈大師排行榜</h1>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3">
                        ${users.map((u, index) => `
                            <div class="p-4 bg-slate-950 rounded-2xl flex justify-between items-center">
                                <span class="font-black text-pink-400">第 ${index + 1} 名：${u.username}</span>
                                <span class="font-bold text-amber-400">⭐ ${u.points} 點</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderFriends(session) {
            return `
                <div class="space-y-6 text-center">
                    <h1 class="text-3xl font-black text-white">👥 好友系統</h1>
                    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 inline-block">
                        <p class="text-slate-400 font-bold">好友功能建置中，可與其他雲端玩家互動！</p>
                    </div>
                </div>
            `;
        }

        function renderAdmin() {
            const pendingList = CloudDB.getPending();
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-black text-white">⚙️ 雲端管理員工作室</h1>
                    <div class="bg-slate-900 p-6 rounded-3xl border-4 border-amber-500/30 space-y-4">
                        <h2 class="text-xl font-black text-amber-400">待審核註冊申請 (${pendingList.length})</h2>
                        ${pendingList.length === 0 ? '<p class="text-slate-400 font-bold">目前沒有等待審核的申請</p>' : ''}
                        ${pendingList.map(p => `
                            <div class="p-4 bg-slate-950 rounded-2xl flex justify-between items-center border border-slate-800">
                                <div>
                                    <div class="font-black text-white">帳號: ${p.username}</div>
                                    <div class="text-xs text-slate-400">初始精靈: ${p.companionType}</div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="window.approveRegistration(${p.id})" class="px-4 py-2 bg-emerald-600 font-black rounded-xl text-sm text-white">允許</button>
                                    <button onclick="window.declineRegistration(${p.id})" class="px-4 py-2 bg-red-600 font-black rounded-xl text-sm text-white">拒絕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderGamePlayer() {
            return `
                <div class="min-h-screen bg-black relative flex flex-col items-center justify-center">
                    <button onclick="window.closeGame()" class="absolute top-6 left-6 px-4 py-2 bg-slate-800 text-white font-black rounded-xl z-50">離開遊戲</button>
                    <div class="w-full h-screen">${activeGame.html}</div>
                </div>
            `;
        }

        window.currentView = 'home';
        window.renderApp = render;
        window.navTo = (v) => { activeGame = null; currentView = v; render(); };
        window.logout = () => { CloudDB.clearSession(); activeGame = null; currentView = 'login'; render(); };

        window.handleLogin = () => {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const users = CloudDB.getUsers();
            const found = users.find(x => x.username === u && x.password === p);
            if (found) {
                CloudDB.setSession(found);
                currentView = 'home';
                render();
            } else {
                alert('帳號或密碼錯誤，或尚未通過審核！');
            }
        };

        window.handleRegister = () => {
            const u = document.getElementById('reg-user').value;
            const p = document.getElementById('reg-pass').value;
            const gender = document.querySelector('input[name="reg-gender"]:checked').value;
            const companionType = document.getElementById('reg-companion').value;
            if (!u || !p) { alert('請填寫帳號密碼！'); return; }
            let pending = CloudDB.getPending();
            pending.push({ id: Date.now(), username: u, password: p, gender, companionType, time: Date.now() });
            CloudDB.savePending(pending);
            currentView = 'pending';
            render();
        };

        window.approveRegistration = (id) => {
            let pending = CloudDB.getPending();
            const p = pending.find(x => x.id === id);
            if (p) {
                let users = CloudDB.getUsers();
                users.push({
                    id: Date.now(), username: p.username, password: p.password, role: 'student', points: 100,
                    gender: p.gender, companions: [{ type: p.companionType, exp: 1, weapon: null }], inventory: [], equipped: {}, background: '', friends: [], friendRequests: []
                });
                CloudDB.saveUsers(users);
                pending = pending.filter(x => x.id !== id);
                CloudDB.savePending(pending);
                alert('已批准註冊！');
                render();
            }
        };

        window.declineRegistration = (id) => {
            let pending = CloudDB.getPending();
            pending = pending.filter(x => x.id !== id);
            CloudDB.savePending(pending);
            render();
        };

        window.playGame = (id) => {
            const games = CloudDB.getGames();
            activeGame = games.find(x => x.id === id);
            render();
        };

        window.closeGame = () => { activeGame = null; render(); };

        window.earnGamePoints = (pts) => {
            let session = CloudDB.getSession();
            if (session) {
                session.points += pts;
                CloudDB.setSession(session);
                alert(`恭喜獲得 ${pts} 積分！`);
                render();
            }
        };

        window.feedCompanion = () => {
            let session = CloudDB.getSession();
            if (session && session.companions && session.companions.length > 0) {
                session.companions[0].exp += 25;
                session.points += 15;
                CloudDB.setSession(session);
                alert('精靈經驗值上升，獲得 15 積分！');
                render();
            }
        };

        window.fightBoss = () => {
            let session = CloudDB.getSession();
            if (session) {
                session.points += 150;
                if (session.companions && session.companions.length > 0) {
                    session.companions[0].exp += 50;
                }
                CloudDB.setSession(session);
                alert('擊敗城堡 Boss！獲得 150 積分與 50 精靈經驗！');
                render();
            }
        };

        window.buyItem = (id) => {
            let session = CloudDB.getSession();
            const store = CloudDB.getStore();
            const item = store.find(x => x.id === id);
            if (item && session.points >= item.price) {
                session.points -= item.price;
                if (!session.inventory.includes(id)) session.inventory.push(id);
                CloudDB.setSession(session);
                alert(`成功購買 ${item.name}！`);
                render();
            } else {
                alert('積分不足或已購買！');
            }
        };

        onValue(ref(db, 'hh_data'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                memoryCache.users = data.users || [];
                memoryCache.pending = data.pending || [];
                memoryCache.games = data.games || getDefaultGames();
                memoryCache.store = data.store || getDefaultStore();
            } else {
                initCloudDB();
            }
            render();
        });
    </script>
</body>
</html>
