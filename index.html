        function initCloudDB() {

            ];
            set(ref(db, 'hh_data'), {
                users: initialUsers,
                pending: [],
                games: getDefaultGames(),
                store: getDefaultStore()
            });
        }

        // 資料庫物件封裝 (整合 Firebase 雲端與 Session)
        window.DB = {
            getUsers() { return memoryCache.users; },
            saveUsers(users) { set(ref(db, 'hh_data/users'), users); },
            getPending() { 
                let list = memoryCache.pending || [];
                const now = Date.now();
                list = list.filter(p => now - p.time < 3600000); // 1小時自動過期
                return list;
            },
            savePending(list) { set(ref(db, 'hh_data/pending'), list); },
            getGames() { return memoryCache.games; },
            saveGames(games) { set(ref(db, 'hh_data/games'), games); },
            getSession() { 
                const u = localStorage.getItem('hh_session'); 
                if (!u) return null;
                let session = JSON.parse(u);
                const users = DB.getUsers();
                const latest = users.find(x => x.id === session.id);
                if (latest) session = latest;
                if (session.role === 'admin' || session.username === 'adminamy') {
                    session.points = 999999;
                }
                return session;
            },
            setSession(user) { 
                if (user.role === 'admin' || user.username === 'adminamy') {
                    user.points = 999999;
                }
                localStorage.setItem('hh_session', JSON.stringify(user)); 
                let users = DB.getUsers();
                let target = users.find(x => x.id === user.id);
                if(target) { target.isOnline = true; DB.saveUsers(users); }
            },
            clearSession() { 
                const session = DB.getSession();
                if(session) {
                    let users = DB.getUsers();
                    let target = users.find(x => x.id === session.id);
                    if(target) { target.isOnline = false; DB.saveUsers(users); }
                }
                localStorage.removeItem('hh_session'); 
            }
        };

            let tier = 1;
            if (exp > 20000 && exp <= 45000) tier = 2;
            else if (exp > 45000 && exp <= 70000) tier = 3;
            else if (exp > 70000 && exp <= 100000) tier = 4;
            else if (exp > 100000) tier = 5;

            const nameMap = {
                water: ['泡泡耳獸', '巨浪角獸', '飛翼潮獸', '裝甲水靈獸', '聖光海皇獸'],
                fire: ['火苗耳獸', '烈焰角獸', '飛翼火獸', '戰鬥炎靈獸', '太陽聖炎獸'],
                grass: ['嫩芽耳獸', '巨藤角獸', '飛翼森獸', '森之木靈獸', '永恆森皇獸'],
                electricity: ['電光耳獸', '閃電角獸', '飛翼雷獸', '雷霆戰獸', '穹蒼雷神獸'],
                ice: ['冰晶耳獸', '霜凍角獸', '飛翼冰獸', '冰甲雪靈獸', '極光冰皇獸']

            const typeList = nameMap[type] || nameMap.water;
            return `${username || '玩家'}的${typeList[tier - 1]}`;

        window.renderCompanionSVG = function(c, ownerName) {
            const exp = c.exp;

            else if (exp > 100000) tier = 5;

            const fullName = getCompanionName(c.type, exp, ownerName);
            const palettes = {
                water: { primary: '#38bdf8', secondary: '#0284c7', accent: '#bae6fd', emoji: '💧' },
                fire: { primary: '#fb923c', secondary: '#ea580c', accent: '#fed7aa', emoji: '🔥' },
                grass: { primary: '#4ade80', secondary: '#16a34a', accent: '#bbf7d0', emoji: '🌿' },
                electricity: { primary: '#facc15', secondary: '#ca8a04', accent: '#fef08a', emoji: '⚡' },
                ice: { primary: '#93c5fd', secondary: '#3b82f6', accent: '#e0f2fe', emoji: '❄️' }

            const pal = palettes[c.type] || palettes.water;

            return `
                <div class="flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border-2 border-purple-500/35 shadow-xl relative overflow-hidden">
                    ${tier === 5 ? `<div class="absolute inset-0 bg-gradient-to-r from-amber-500/20 to-purple-500/20 rounded-3xl animate-pulse flex items-center justify-center"><span class="text-6xl opacity-30">${pal.emoji}</span></div>` : ''}
                    <svg width="140" height="140" viewBox="0 0 140 140" class="pixel-sprite relative z-10">
                        <ellipse cx="70" cy="122" rx="26" ry="7" fill="${pal.accent}" opacity="0.7" />
                        ${tier >= 4 ? `<rect x="42" y="85" width="10" height="20" fill="${pal.secondary}" rx="3" /><rect x="88" y="85" width="10" height="20" fill="${pal.secondary}" rx="3" /><rect x="50" y="102" width="12" height="10" fill="#0f172a" rx="3" /><rect x="78" y="102" width="12" height="10" fill="#0f172a" rx="3" />` : ''}
                        ${tier >= 3 ? `<path d="M 40 50 Q 20 30 35 70 Z" fill="${tier === 5 ? '#facc15' : pal.secondary}" opacity="0.85" /><path d="M 100 50 Q 120 30 105 70 Z" fill="${tier === 5 ? '#facc15' : pal.secondary}" opacity="0.85" />` : ''}
                        <circle cx="70" cy="70" r="${tier === 2 ? 34 : 28}" fill="${pal.primary}" stroke="#0f172a" stroke-width="3" />
                        <circle cx="58" cy="62" r="5" fill="#0f172a" /><circle cx="82" cy="62" r="5" fill="#0f172a" />
                        <circle cx="59" cy="61" r="1.5" fill="#fff" /><circle cx="83" cy="61" r="1.5" fill="#fff" />
                        <path d="M 62 76 Q 70 82 78 76" stroke="#0f172a" stroke-width="3" fill="none" />
                        ${tier === 1 ? `<polygon points="45,45 30,30 45,60" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" /><polygon points="95,45 110,30 95,60" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />` : ''}
                        ${tier >= 2 ? `<polygon points="42,42 22,22 46,58" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" /><polygon points="98,42 118,22 94,58" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />` : ''}
                        ${tier === 5 && c.weapon ? `<g transform="translate(95, 60)">${c.weapon === 'sword' ? '<rect x="0" y="-15" width="4" height="30" fill="#cbd5e1" /><rect x="-4" y="0" width="12" height="4" fill="#b45309" />' : ''}${c.weapon === 'gun' ? '<rect x="-5" y="-3" width="20" height="8" fill="#334155" /><rect x="5" y="3" width="6" height="8" fill="#1e293b" />' : ''}${c.weapon === 'wand' ? '<circle cx="6" cy="-12" r="7" fill="#ec4899" /><rect x="4" y="-5" width="4" height="24" fill="#a16207" />' : ''}</g>` : ''}
                    </svg>
                    <div class="mt-2 font-black text-xs text-pink-300">${fullName}</div>
                    <div class="mt-2 font-black text-sm bg-purple-950 text-purple-200 px-4 py-1.5 rounded-full shadow-sm border border-purple-500/40 relative z-10">冒險經驗: ${exp}</div>
                </div>
            `;
        }

        window.renderBossSVG = function(levelIdx, state = 'normal') {
            const colors = ['#dc2626', '#ea580c', '#d97706', '#ca8a04', '#16a34a', '#0d9488', '#0284c7', '#2563eb', '#7c3aed', '#db2777', '#991b1b', '#7c2d12', '#78350f', '#365314', '#064e3b', '#164e63', '#1e3a8a', '#3b0764', '#500724', '#000000'];
            const color = colors[levelIdx % colors.length];
            const sizeScale = 1 + (levelIdx * 0.04);
            const weapons = ['⚔️', '🗡️', '🛡️', '🔱', '🪄', '🏹', '🔨', '🪓', '⚡', '🔥'];
            const weapon = weapons[levelIdx % weapons.length];

            let face = `<circle cx="72" cy="95" r="7" fill="#facc15" /><circle cx="108" cy="95" r="7" fill="#facc15" /><circle cx="72" cy="95" r="3" fill="#000" /><circle cx="108" cy="95" r="3" fill="#000" /><path d="M 75 115 Q 90 100 105 115" stroke="#000" stroke-width="4" fill="none" />`;
            if (state === 'dead') {
                face = `<text x="65" y="100" font-size="16" font-weight="900" fill="#000">❌</text><text x="100" y="100" font-size="16" font-weight="900" fill="#000">❌</text><path d="M 75 115 Q 90 125 105 115" stroke="#000" stroke-width="4" fill="none" />`;
            }
            const scaleClass = state === 'giant' ? 'transform scale-[5] transition-transform duration-500' : 'boss-sprite';

            return `
                <div class="flex items-center justify-center my-4 overflow-hidden">
                    <svg width="${160 * sizeScale}" height="${160 * sizeScale}" viewBox="0 0 180 180" class="${scaleClass} mx-auto">
                        <ellipse cx="90" cy="160" rx="${40 + levelIdx}" ry="12" fill="rgba(239, 68, 68, 0.4)" />
                        <polygon points="90,15 ${50 - levelIdx},60 ${130 + levelIdx},60" fill="${color}" />
                        <circle cx="90" cy="95" r="${35 + (levelIdx * 1.5)}" fill="${color}" stroke="#000" stroke-width="3" />
                        ${levelIdx >= 5 ? `<circle cx="50" cy="95" r="12" fill="#fbbf24" /><circle cx="130" cy="95" r="12" fill="#fbbf24" />` : ''}
                        ${levelIdx >= 10 ? `<text x="125" y="70" font-size="28">${weapon}</text>` : ''}
                        ${face}
                    </svg>
                </div>
            `;
        }

        window.getStoreItemColor = function(itemId) {
            const store = getDefaultStore();
            const item = store.find(i => i.id == itemId);
            return item ? item.color : '#000';
        }

        window.getStoreItemObject = function(itemId) {
            const store = getDefaultStore();
            return store.find(i => i.id == itemId) || null;
        }

        window.navTo = function(view) { currentView = view; render(); }

        window.recordHistory = function(user, action) {
            if (!user.history) user.history = [];
            user.history.unshift({ time: new Date().toLocaleString(), action });
            if (user.history.length > 50) user.history.pop();
        }

        window.earnGamePoints = function(pts) {
            const session = DB.getSession();
            if (!session) return;
            if (session.isBannedPoints) { alert('您的積分功能已被禁分！'); return; }

            const today = new Date().toDateString();
            if (session.lastEarnDate !== today) {
                session.lastEarnDate = today;
                session.dailyEarned = 0;
            }
            if (session.dailyEarned >= 500) {
                alert('您今天從遊戲中獲得的積分已達上限 (500點)！');
                return;
            }

            const actualPts = Math.min(pts, 500 - session.dailyEarned);
            session.dailyEarned += actualPts;
            session.points += actualPts;
            recordHistory(session, `遊玩遊戲獲得 ${actualPts} 積分`);
            DB.setSession(session);
            updateUserInDB(session);
            alert(`恭喜獲得 ${actualPts} 冒險積分！`);
            render();
        };

        window.handleLogin = function() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const users = DB.getUsers();
            const found = users.find(x => x.username === u && x.password === p);
            if (found) {
                if (found.role === 'admin' || found.username === 'adminamy') found.points = 999999;
                recordHistory(found, '登入網站');
                DB.setSession(found);
                updateUserInDB(found);
                currentView = 'home';
                render();
            } else {
                alert('帳號或密碼錯誤，或尚未通過管理員審核！');
            }
        }

        window.handleRegister = function() {
            const u = document.getElementById('reg-user').value;
            const p = document.getElementById('reg-pass').value;
            const gender = document.querySelector('input[name="reg-gender"]:checked').value;
            const companionType = document.getElementById('reg-companion').value;

            if (!/^[A-Za-z0-9]+$/.test(u)) { alert('帳號僅限英文字母與數字！'); return; }
            const users = DB.getUsers();
            if (users.some(x => x.username === u)) { alert('帳號已被註冊！'); return; }
            let pending = DB.getPending();
            if (pending.some(x => x.username === u)) { alert('此帳號已有審核中的申請！'); return; }

            pending.push({ id: Date.now(), username: u, password: p, gender, companionType, time: Date.now() });
            DB.savePending(pending);
            currentView = 'pending';
            render();
        }

        window.fightBoss = function(levelIdx) {
            const session = DB.getSession();
            const petIdx = parseInt(document.getElementById('selected-pet').value);
            const pet = session.companions[petIdx];
            const bossHp = bossHpList[levelIdx];

            let win = pet.exp > bossHp ? true : (pet.exp === bossHp ? Math.random() < 0.5 : false);
            const container = document.getElementById('boss-container');
            if (container) container.innerHTML = renderBossSVG(levelIdx, win ? 'dead' : 'giant');

            setTimeout(() => {
                document.getElementById('boss-modal').innerHTML = '';
                if (win) {
                    session.points += 1000;
                    recordHistory(session, `挑戰城堡第 ${levelIdx + 1} 層 Boss 勝利`);
                    DB.setSession(session);
                    updateUserInDB(session);
                    alert(`🎉 挑戰成功！獲得額外 1000 積分獎勵！`);
                } else {
                    recordHistory(session, `挑戰城堡第 ${levelIdx + 1} 層 Boss 失敗`);
                    alert(`❌ 挑戰失敗！精靈實力尚需提升！`);

                render();
            }, 1200);

            const store = getDefaultStore();
            const html = `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-900 p-8 rounded-3xl max-w-3xl w-full max-h-[85vh] overflow-y-auto space-y-6 shadow-2xl border-4 border-pink-500/40">
                        <div class="flex justify-between items-center">
                            <h3 class="text-3xl font-black text-white">👕 我的衣櫥</h3>
                            <button onclick="document.getElementById('wardrobe-modal').innerHTML=''" class="font-black text-xl px-4 py-2 bg-slate-800 text-white rounded-xl">✕</button>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            ${session.inventory.map(itemId => {
                                const item = store.find(s => s.id === itemId);
                                const isEquipped = item.slot === 'background' ? session.background === item.id : session.equipped[item.slot] === item.id;
                                return `
                                    <div class="p-4 bg-slate-950 border-2 ${isEquipped ? 'border-pink-500' : 'border-slate-800'} rounded-2xl text-center space-y-3">
                                        <div class="text-3xl mb-2">${item.icon}</div>
                                        <div class="font-black text-white">${item.name}</div>
                                        <div class="flex gap-2">
                                            <button onclick="window.equipItem(${item.id}, '${item.slot}')" class="flex-1 py-2 bg-purple-600 text-white font-black rounded-xl text-sm">穿上/套用</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('wardrobe-modal').innerHTML = html;
        }

        window.equipItem = function(itemId, slot) {
            const session = DB.getSession();
            if (slot === 'background') session.background = itemId;
            else session.equipped[slot] = itemId;
            DB.setSession(session);
            updateUserInDB(session);
            renderWardrobeModal();
            render();
        }

        window.renderStore = function(session) {
            const store = getDefaultStore();
            return `
                <div class="space-y-6">
                    <h1 class="text-4xl font-black text-white">🛍️ 服裝與背景商店</h1>
                    <div class="grid md:grid-cols-4 gap-6">
                        ${store.map(item => `
                            <div class="bg-slate-900/90 backdrop-blur-md p-6 rounded-3xl shadow-xl border-4 border-pink-500/30 flex flex-col justify-between text-center">
                                <div>
                                    <div class="text-6xl my-4">${item.icon}</div>
                                    <div class="text-xl font-black text-white">${item.name}</div>
                                    <div class="text-amber-400 font-black mt-2 text-lg">⭐ ${item.price} 點</div>
                                </div>
                                <button onclick="window.buyItem(${item.id},${item.price})" class="mt-6 py-3 bg-pink-600 text-white font-black rounded-2xl shadow-md">購買商品</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.buyItem = function(itemId, price) {
            const session = DB.getSession();
            if (session.inventory.includes(itemId)) { alert('您已擁有此商品！'); return; }
            if (session.points < price) { alert('點數不足！'); return; }
            session.points -= price;
            session.inventory.push(itemId);
            DB.setSession(session);
            updateUserInDB(session);
            alert('購買成功！');
            render();
        }

        window.renderRanking = function() {
            const users = DB.getUsers().filter(u => u.role === 'student').sort((a, b) => b.points - a.points);
            return `
                <div class="space-y-6">
                    <h1 class="text-4xl font-black text-white">🏆 精靈大師排行榜</h1>
                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-amber-500/30 space-y-4">
                        ${users.map((u, index) => `
                            <div class="p-4 bg-slate-950/80 rounded-2xl border-2 border-slate-800 flex justify-between items-center">
                                <div class="font-black text-lg text-white">#${index + 1}${u.username}</div>
                                <div class="text-amber-400 font-black text-xl">⭐ ${u.points} 積分</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.renderFriends = function(session) {
            return `
                <div class="space-y-6 text-center">
                    <h1 class="text-4xl font-black text-white">👥 好友系統</h1>
                    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 inline-block">
                        <p class="text-slate-400 font-bold">好友功能建置中，雲端連線正常運作！</p>
                    </div>
                </div>
            `;
        }

        window.renderAdmin = function() {
            const pendingList = DB.getPending();
            return `
                <div class="space-y-8">
                    <h1 class="text-4xl font-black text-white">⚙️ 雲端管理員工作室</h1>
                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-amber-500/30 space-y-6">
                        <h2 class="text-2xl font-black text-white">待審核註冊申請 (${pendingList.length})</h2>
                        <div class="space-y-4">
                            ${pendingList.length === 0 ? '<p class="text-slate-400 font-bold">目前沒有等待審核的註冊申請</p>' : ''}
                            ${pendingList.map(p => `
                                <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div>
                                        <div class="font-black text-lg text-white">帳號: ${p.username}</div>
                                        <div class="text-xs text-slate-400 font-bold">初始精靈: ${p.companionType}</div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="window.approveRegistration(${p.id})" class="px-4 py-2 bg-emerald-600 text-white font-black rounded-xl text-sm">允許</button>
                                        <button onclick="window.declineRegistration(${p.id})" class="px-4 py-2 bg-red-600 text-white font-black rounded-xl text-sm">拒絕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.approveRegistration = function(id) {
            let pending = DB.getPending();
            const p = pending.find(x => x.id === id);
            if (p) {
                let users = DB.getUsers();
                users.push({
                    id: Date.now(), username: p.username, password: p.password, role: 'student', points: 100,
                    gender: p.gender, companions: [{ type: p.companionType, exp: 1, weapon: null }], inventory: [], equipped: {}, background: '', friends: [], friendRequests: [], history: [], isBannedPoints: false
                });
                DB.saveUsers(users);
                pending = pending.filter(x => x.id !== id);
                DB.savePending(pending);
                alert('已允許該玩家註冊！');
                render();
            }
        }

        window.declineRegistration = function(id) {
            let pending = DB.getPending();
            pending = pending.filter(x => x.id !== id);
            DB.savePending(pending);
            alert('已拒絕該玩家註冊。');
            render();
        }

        window.updateUserInDB = function(sessionUser) {
            const users = DB.getUsers();
            if (sessionUser.role === 'admin' || sessionUser.username === 'adminamy') sessionUser.points = 999999;
            const idx = users.findIndex(x => x.id === sessionUser.id);
            if (idx !== -1) { users[idx] = sessionUser; DB.saveUsers(users); }
        }

        // --- 啟動 Firebase 即時監聽 ---
        onValue(ref(db, 'hh_data'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                memoryCache.users = data.users || [];
                memoryCache.pending = data.pending || [];
                memoryCache.games = data.games || getDefaultGames();
                memoryCache.store = data.store || getDefaultStore();
            } else {
                initCloudDB();
            }
            render();
        });
    </script>
</body>
</html>
