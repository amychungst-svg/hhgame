    <style>
        @keyframes float-anim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulse-boss {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pixel-sprite {
            image-rendering: pixelated;
            animation: float-anim 3s ease-in-out infinite;
        }
        .boss-sprite {
            animation: pulse-boss 1.5s ease-in-out infinite;
        }
    </style>
</head>

        // --- 系統資料庫與初始化 ---
        if (!localStorage.getItem('hh_v20_init')) {
            localStorage.clear();
            localStorage.setItem('hh_v20_init', 'true');
        }

        const DB = {
            getUsers() { return JSON.parse(localStorage.getItem('hh_users') || '[]'); },
            saveUsers(users) { localStorage.setItem('hh_users', JSON.stringify(users)); },
            getPending() { 
                let list = JSON.parse(localStorage.getItem('hh_pending') || '[]');
                const now = Date.now();
                list = list.filter(p => now - p.time < 3600000); // 1小時自動過期
                localStorage.setItem('hh_pending', JSON.stringify(list));
                return list;
            },
            savePending(list) { localStorage.setItem('hh_pending', JSON.stringify(list)); },
            getGames() { return JSON.parse(localStorage.getItem('hh_games') || JSON.stringify([
                { id: 1, title: '魔法方塊冒險', thumb: '', html: '<div style="background:linear-gradient(135deg,#6366f1,#ec4899);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:sans-serif;text-align:center;"><h1>✨ 魔法方塊冒險 ✨</h1><p style="margin:10px 0;">點擊下方按鈕賺取冒險積分！</p><button onclick="parent.earnGamePoints(50)" style="padding:16px 32px;background:#fbbf24;color:#000;border:none;border-radius:16px;font-weight:900;cursor:pointer;font-size:18px;box-shadow:0 4px 20px rgba(0,0,0,0.4);">獲得 50 積分</button></div>', playCount: 42, isBanned: false }
            ])); },
            saveGames(games) { localStorage.setItem('hh_games', JSON.stringify(games)); },
            getSession() { 
                const u = localStorage.getItem('hh_session'); 
                if (!u) return null;
                let session = JSON.parse(u);
                if (session.role === 'admin' || session.username === 'adminamy') {
                    session.points = 999999;
                }
                return session;
            },
            setSession(user) { 
                if (user.role === 'admin' || user.username === 'adminamy') {
                    user.points = 999999;
                }
                localStorage.setItem('hh_session', JSON.stringify(user)); 
                let users = DB.getUsers();
                let target = users.find(x => x.id === user.id);
                if(target) { target.isOnline = true; DB.saveUsers(users); }
            },
            clearSession() { 
                const session = DB.getSession();
                if(session) {
                    let users = DB.getUsers();
                    let target = users.find(x => x.id === session.id);
                    if(target) { target.isOnline = false; DB.saveUsers(users); }
                }
                localStorage.removeItem('hh_session'); 
            }
        };

                { id: 34, name: '學校背景', svg: '<svg viewBox="0 0 100 100" class="w-full h-full"><rect width="100" height="100" fill="#b45309"/><path d="M0 50 Q50 20 100 50 L100 100 L0 100 Z" fill="#78350f" opacity="0.6"/></svg>', color: 'from-amber-700 to-orange-900', slot: 'background', price: 2000, icon: '🏫' },
                { id: 35, name: '壁爐背景', svg: '<svg viewBox="0 0 100 100" class="w-full h-full"><rect width="100" height="100" fill="#991b1b"/><circle cx="50" cy="50" r="25" fill="#f59e0b" opacity="0.6"/></svg>', color: 'from-red-900 to-amber-950', slot: 'background', price: 2000, icon: '🔥' },

            ]));
        }

        let currentView = 'login';
        let activeGame = null;

        function render() {
            const app = document.getElementById('app');
            const session = DB.getSession();
            if (!session && currentView !== 'register' && currentView !== 'pending') currentView = 'login';

            let html = '';
            if (currentView === 'login') html = renderLogin();
            else if (currentView === 'register') html = renderRegister();
            else if (currentView === 'pending') html = renderPendingNotice();
            else {
                html = renderNavbar(session) + '<div class="max-w-6xl mx-auto p-6">' + renderContent(session) + '</div>';
            }
            app.innerHTML = html;
        }

        function renderNavbar(session) {
            return `
                <nav class="bg-slate-950/90 backdrop-blur-md shadow-xl sticky top-0 z-50 px-6 py-4 flex justify-between items-center rounded-b-3xl mx-4 mt-2 border-b-2 border-pink-500/30">
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-black bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">精靈世界 @HH</span>
                        <span class="bg-purple-950 text-purple-200 text-xs px-3 py-1 rounded-full font-bold border border-purple-500/40 flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block animate-pulse"></span>玩家：${session.username}</span>
                        <span class="bg-amber-950 text-amber-200 text-xs px-3 py-1 rounded-full font-bold border border-amber-500/40">⭐ ${session.role === 'admin' ? '無限 (999999)' : session.points} 點</span>
                    </div>

                        <button onclick="navTo('library')" class="hover:text-pink-400 transition">遊戲中心</button>
                        <button onclick="navTo('homeland')" class="hover:text-pink-400 transition">家園與衣櫥</button>
                        <button onclick="navTo('castle')" class="hover:text-pink-400 transition">城堡挑戰</button>
                        <button onclick="navTo('store')" class="hover:text-pink-400 transition">服裝商店</button>
                        <button onclick="navTo('ranking')" class="hover:text-pink-400 transition">精靈大師排行</button>
                        <button onclick="navTo('friends')" class="hover:text-pink-400 transition">好友系統</button>
                        ${session.role === 'admin' ? '<button onclick="navTo(\'admin\')" class="text-pink-400 hover:text-pink-300 transition">管理員工作室</button>' : ''}
                        <button onclick="logout()" class="text-slate-400 hover:text-slate-200 transition">登出</button>

        function renderLogin() {

                        <div class="text-center space-y-2">
                            <h1 class="text-4xl font-black bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">精靈世界 @HH</h1>
                            <p class="text-slate-300 font-bold text-sm">探索世界、養成你的精靈夥伴、成爲精靈大師！</p>
                        </div>

                            <input id="login-user" type="text" placeholder="請輸入帳號 (英文與數字)" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl focus:border-pink-500 outline-none font-bold text-white">
                            <input id="login-pass" type="password" placeholder="請輸入密碼" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl focus:border-pink-500 outline-none font-bold text-white">
                            <button onclick="handleLogin()" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black rounded-2xl shadow-lg hover:opacity-95 transition">登入冒險</button>

                        </div>
                    </div>
                    <div class="text-center text-xs text-slate-500 mt-6 font-bold">HH@amychungst</div>

            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border-4 border-purple-500/40">
                        <h1 class="text-3xl font-black text-center mb-6 text-pink-400">註冊帳號 (需管理員審核)</h1>
                        <div class="space-y-4">

        function renderPendingNotice() {

        function renderContent(session) {
            if (currentView === 'home') return `
                <div class="space-y-8">
                    <div class="bg-slate-900/90 backdrop-blur-md p-10 rounded-3xl shadow-xl border-4 border-pink-500/30 text-center">

                        <div onclick="navTo('homeland')" class="bg-gradient-to-br from-emerald-500 to-teal-600 p-8 rounded-3xl shadow-lg cursor-pointer hover:scale-105 transition font-black text-2xl text-slate-950">🏡 家園與衣櫥</div>

            `;
            if (currentView === 'library') return renderLibrary();
            if (currentView === 'playgame') return renderPlayGame();

            if (currentView === 'castle') return renderCastle(session);
            if (currentView === 'store') return renderStore(session);
            if (currentView === 'ranking') return renderRanking();
            if (currentView === 'friends') return renderFriends(session);
            if (currentView === 'admin') return renderAdmin();
            return '';
        }

        // --- Avatar SVG ---

            const pantsColor = equipped.pants ? getStoreItemColor(equipped.pants) : uniformPants;
            const dressColor = equipped.dress ? getStoreItemColor(equipped.dress) : '';
            const shoesColor = equipped.shoes ? getStoreItemColor(equipped.shoes) : '#0f172a';
            const handheldItem = equipped.handheld ? getStoreItemObject(equipped.handheld) : null;

                    <rect x="72" y="60" width="16" height="4" fill="#fb7185" opacity="0.7" rx="2" />

                    ${gender === 'boy' ? '<rect x="40" y="10" width="80" height="26" fill="#1e293b" rx="8" /><rect x="38" y="26" width="12" height="34" fill="#1e293b" rx="4" />' : '<path d="M42 38 Q45 6 80 10 Q115 6 118 38 Z" fill="#b45309" /><rect x="40" y="28" width="14" height="38" fill="#b45309" rx="4" /><rect x="106" y="28" width="12" height="34" fill="#b45309" rx="4" />'}
                    ${equipped.hat ? `<rect x="36" y="4" width="88" height="18" fill="${hatColor}" rx="6" />` : ''}
                    ${equipped.glasses ? `<rect x="52" y="40" width="56" height="16" fill="${glassesColor}" rx="4" /><line x1="74" y1="48" x2="86" y2="48" stroke="#94a3b8" stroke-width="2"/>` : ''}
                    ${equipped.hairclip ? `<circle cx="104" cy="24" r="8" fill="${hairclipColor}" />` : ''}
                </svg>
            `;
        }

        // --- Companion SVG ---
        function getCompanionName(type, exp, username) {
            let tier = 1;
            if (exp > 20000 && exp <= 45000) tier = 2;
            else if (exp > 45000 && exp <= 70000) tier = 3;
            else if (exp > 70000 && exp <= 100000) tier = 4;
            else if (exp > 100000) tier = 5;

            const nameMap = {
                water: ['泡泡耳獸', '巨浪角獸', '飛翼潮獸', '裝甲水靈獸', '聖光海皇獸'],
                fire: ['火苗耳獸', '烈焰角獸', '飛翼火獸', '戰鬥炎靈獸', '太陽聖炎獸'],
                grass: ['嫩芽耳獸', '巨藤角獸', '飛翼森獸', '森之木靈獸', '永恆森皇獸'],
                electricity: ['電光耳獸', '閃電角獸', '飛翼雷獸', '雷霆戰獸', '穹蒼雷神獸'],
                ice: ['冰晶耳獸', '霜凍角獸', '飛翼冰獸', '冰甲雪靈獸', '極光冰皇獸']
            };
            const typeList = nameMap[type] || nameMap.water;
            return `${username || '玩家'}的${typeList[tier - 1]}`;
        }

        function renderCompanionSVG(c, ownerName) {
            const exp = c.exp;
            let tier = 1;
            if (exp > 20000 && exp <= 45000) tier = 2;
            else if (exp > 45000 && exp <= 70000) tier = 3;
            else if (exp > 70000 && exp <= 100000) tier = 4;
            else if (exp > 100000) tier = 5;

            const fullName = getCompanionName(c.type, exp, ownerName);

            const palettes = {
                water: { primary: '#38bdf8', secondary: '#0284c7', accent: '#bae6fd', emoji: '💧' },
                fire: { primary: '#fb923c', secondary: '#ea580c', accent: '#fed7aa', emoji: '🔥' },
                grass: { primary: '#4ade80', secondary: '#16a34a', accent: '#bbf7d0', emoji: '🌿' },
                electricity: { primary: '#facc15', secondary: '#ca8a04', accent: '#fef08a', emoji: '⚡' },
                ice: { primary: '#93c5fd', secondary: '#3b82f6', accent: '#e0f2fe', emoji: '❄️' }
            };
            const pal = palettes[c.type] || palettes.water;

            return `
                <div class="flex flex-col items-center justify-center p-6 bg-slate-900/90 rounded-3xl border-2 border-purple-500/35 shadow-xl relative overflow-hidden">
                    ${tier === 5 ? `
                        <div class="absolute inset-0 bg-gradient-to-r from-amber-500/20 to-purple-500/20 rounded-3xl animate-pulse flex items-center justify-center">
                            <span class="text-6xl opacity-30">${pal.emoji}</span>
                        </div>
                    ` : ''}
                    <svg width="140" height="140" viewBox="0 0 140 140" class="pixel-sprite relative z-10">
                        <ellipse cx="70" cy="122" rx="26" ry="7" fill="${pal.accent}" opacity="0.7" />

                        ${tier >= 4 ? `
                            <rect x="42" y="85" width="10" height="20" fill="${pal.secondary}" rx="3" />
                            <rect x="88" y="85" width="10" height="20" fill="${pal.secondary}" rx="3" />
                            <rect x="50" y="102" width="12" height="10" fill="#0f172a" rx="3" />
                            <rect x="78" y="102" width="12" height="10" fill="#0f172a" rx="3" />
                        ` : ''}

                        ${tier >= 3 ? `
                            <path d="M 40 50 Q 20 30 35 70 Z" fill="${tier === 5 ? '#facc15' : pal.secondary}" opacity="0.85" />
                            <path d="M 100 50 Q 120 30 105 70 Z" fill="${tier === 5 ? '#facc15' : pal.secondary}" opacity="0.85" />
                        ` : ''}

                        <circle cx="70" cy="70" r="${tier === 2 ? 34 : 28}" fill="${pal.primary}" stroke="#0f172a" stroke-width="3" />
                        
                        <circle cx="58" cy="62" r="5" fill="#0f172a" /><circle cx="82" cy="62" r="5" fill="#0f172a" />
                        <circle cx="59" cy="61" r="1.5" fill="#fff" /><circle cx="83" cy="61" r="1.5" fill="#fff" />
                        <path d="M 62 76 Q 70 82 78 76" stroke="#0f172a" stroke-width="3" fill="none" />

                        ${tier === 1 ? `
                            <polygon points="45,45 30,30 45,60" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />
                            <polygon points="95,45 110,30 95,60" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />
                        ` : ''}
                        ${tier >= 2 ? `
                            <polygon points="42,42 22,22 46,58" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />
                            <polygon points="98,42 118,22 94,58" fill="${pal.secondary}" stroke="#0f172a" stroke-width="2" />
                        ` : ''}

                        ${tier === 5 && c.weapon ? `
                            <g transform="translate(95, 60)">
                                ${c.weapon === 'sword' ? '<rect x="0" y="-15" width="4" height="30" fill="#cbd5e1" /><rect x="-4" y="0" width="12" height="4" fill="#b45309" />' : ''}
                                ${c.weapon === 'gun' ? '<rect x="-5" y="-3" width="20" height="8" fill="#334155" /><rect x="5" y="3" width="6" height="8" fill="#1e293b" />' : ''}
                                ${c.weapon === 'wand' ? '<circle cx="6" cy="-12" r="7" fill="#ec4899" /><rect x="4" y="-5" width="4" height="24" fill="#a16207" />' : ''}
                            </g>
                        ` : ''}
                    </svg>
                    <div class="mt-2 font-black text-xs text-pink-300">${fullName}</div>
                    <div class="mt-2 font-black text-sm bg-purple-950 text-purple-200 px-4 py-1.5 rounded-full shadow-sm border border-purple-500/40 relative z-10">冒險經驗: ${exp}</div>
                </div>
            `;
        }

        // --- 20 層獨特 Boss SVG 產生器 ---
        function renderBossSVG(levelIdx, state = 'normal') {
            const colors = ['#dc2626', '#ea580c', '#d97706', '#ca8a04', '#16a34a', '#0d9488', '#0284c7', '#2563eb', '#7c3aed', '#db2777', '#991b1b', '#7c2d12', '#78350f', '#365314', '#064e3b', '#164e63', '#1e3a8a', '#3b0764', '#500724', '#000000'];
            const color = colors[levelIdx % colors.length];
            const sizeScale = 1 + (levelIdx * 0.04);
            const weapons = ['⚔️', '🗡️', '🛡️', '🔱', '🪄', '🏹', '🔨', '🪓', '⚡', '🔥'];
            const weapon = weapons[levelIdx % weapons.length];

            let face = `
                <circle cx="72" cy="95" r="7" fill="#facc15" /><circle cx="108" cy="95" r="7" fill="#facc15" />
                <circle cx="72" cy="95" r="3" fill="#000" /><circle cx="108" cy="95" r="3" fill="#000" />
                <path d="M 75 115 Q 90 100 105 115" stroke="#000" stroke-width="4" fill="none" />
            `;
            if (state === 'dead') {
                face = `
                    <text x="65" y="100" font-size="16" font-weight="900" fill="#000">❌</text>
                    <text x="100" y="100" font-size="16" font-weight="900" fill="#000">❌</text>
                    <path d="M 75 115 Q 90 125 105 115" stroke="#000" stroke-width="4" fill="none" />
                `;
            }

            const scaleClass = state === 'giant' ? 'transform scale-[5] transition-transform duration-500' : 'boss-sprite';

            return `
                <div class="flex items-center justify-center my-4 overflow-hidden">
                    <svg width="${160 * sizeScale}" height="${160 * sizeScale}" viewBox="0 0 180 180" class="${scaleClass} mx-auto">
                        <ellipse cx="90" cy="160" rx="${40 + levelIdx}" ry="12" fill="rgba(239, 68, 68, 0.4)" />
                        <polygon points="90,15 ${50 - levelIdx},60 ${130 + levelIdx},60" fill="${color}" />
                        <circle cx="90" cy="95" r="${35 + (levelIdx * 1.5)}" fill="${color}" stroke="#000" stroke-width="3" />
                        ${levelIdx >= 5 ? `<circle cx="50" cy="95" r="12" fill="#fbbf24" /><circle cx="130" cy="95" r="12" fill="#fbbf24" />` : ''}
                        ${levelIdx >= 10 ? `<text x="125" y="70" font-size="28">${weapon}</text>` : ''}
                        ${face}
                    </svg>
                </div>
            `;
        }

        function getStoreItemColor(itemId) {
            const store = JSON.parse(localStorage.getItem('hh_store') || '[]');
            const item = store.find(i => i.id == itemId);
            return item ? item.color : '#000';
        }

        function getStoreItemObject(itemId) {
            const store = JSON.parse(localStorage.getItem('hh_store') || '[]');
            return store.find(i => i.id == itemId) || null;
        }

        function navTo(view) { currentView = view; render(); }

        function recordHistory(user, action) {
            if (!user.history) user.history = [];
            user.history.unshift({ time: new Date().toLocaleString(), action });
            if (user.history.length > 50) user.history.pop();
        }

        window.earnGamePoints = function(pts) {
            const session = DB.getSession();
            if (!session) return;
            if (session.isBannedPoints) { alert('您的積分功能已被禁分，無法獲得遊戲積分！'); return; }

            const today = new Date().toDateString();
            if (session.lastEarnDate !== today) {
                session.lastEarnDate = today;
                session.dailyEarned = 0;
            }

            if (session.dailyEarned >= 500) {
                alert('您今天從遊戲中獲得的積分已達上限 (500點)！您可以繼續暢玩遊戲，但不會再獲得新積分。');
                return;
            }

            const actualPts = Math.min(pts, 500 - session.dailyEarned);
            session.dailyEarned += actualPts;
            session.points += actualPts;
            recordHistory(session, `遊玩遊戲獲得 ${actualPts} 積分 (今日已累積 ${session.dailyEarned}/500點)`);
            DB.setSession(session);
            updateUserInDB(session);
            alert(`恭喜獲得 ${actualPts} 冒險積分！`);
            render();
        };

        function handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const users = DB.getUsers();
            const found = users.find(x => x.username === u && x.password === p);
            if (found) {
                if (found.role === 'admin' || found.username === 'adminamy') {
                    found.points = 999999;
                }
                recordHistory(found, '登入網站');
                DB.setSession(found);
                updateUserInDB(found);
                currentView = 'home';
                render();
            } else {
                alert('帳號或密碼錯誤，或尚未通過管理員審核！');
            }
        }

        function handleRegister() {
            const u = document.getElementById('reg-user').value;
            const p = document.getElementById('reg-pass').value;
            const gender = document.querySelector('input[name="reg-gender"]:checked').value;
            const companionType = document.getElementById('reg-companion').value;

            if (!/^[A-Za-z0-9]+$/.test(u)) { alert('帳號僅限英文字母與數字！'); return; }
            const users = DB.getUsers();
            if (users.some(x => x.username === u)) { alert('帳號已被註冊！'); return; }
            const pending = DB.getPending();
            if (pending.some(x => x.username === u)) { alert('此帳號已有審核中的申請！'); return; }

            pending.push({
                id: Date.now(), username: u, password: p, gender: gender,
                companionType: companionType, time: Date.now()
            });
            DB.savePending(pending);
            currentView = 'pending';
            render();
        }

        function logout() { DB.clearSession(); currentView = 'login'; render(); }

        // --- 城堡 20 層 Boss 挑戰系統 ---
        const bossHpList = [200, 1000, 1500, 3000, 5000, 8000, 10000, 15000, 18000, 25000, 35000, 45000, 55000, 65000, 80000, 95000, 100000, 120000, 150000, 200000];

        function renderCastle(session) {
            return `
                <div class="space-y-6">
                    <h1 class="text-4xl font-black text-white">🏰 城堡 Boss 挑戰 (共 20 層)</h1>
                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-red-500/30 space-y-6">
                        <div class="grid md:grid-cols-4 gap-4">
                            ${bossHpList.map((hp, idx) => `
                                <div class="p-5 bg-slate-950 rounded-2xl border-2 border-slate-800 text-center space-y-3 flex flex-col justify-between">
                                    <div>
                                        <div class="text-xl font-black text-amber-400">第 ${idx + 1} 層</div>
                                        <div class="text-sm font-bold text-slate-300 mt-2">Boss HP: ${hp}</div>
                                    </div>
                                    <button onclick="openBossRoom(${idx})" class="w-full py-2.5 bg-red-600 text-white font-black rounded-xl text-sm shadow hover:bg-red-700 transition">進入房間</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                <div id="boss-modal"></div>
            `;
        }

        function openBossRoom(levelIdx) {
            const session = DB.getSession();
            const bossHp = bossHpList[levelIdx];
            const html = `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-900 p-8 rounded-3xl max-w-md w-full space-y-6 text-center shadow-2xl border-4 border-red-500/40">
                        <h3 class="text-3xl font-black text-red-400">🏰 第 ${levelIdx + 1} 層 Boss 房間</h3>
                        <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                            <div class="text-sm font-bold text-slate-300">Boss 血量 (HP)</div>
                            <div class="text-4xl font-black text-amber-400">${bossHp}</div>
                            <div id="boss-container" onclick="clickBoss(${levelIdx})" title="點擊攻擊 Boss！" class="cursor-pointer">
                                ${renderBossSVG(levelIdx, 'normal')}
                            </div>
                            <div class="text-xs text-slate-400 font-bold">💡 點擊上方 Boss 持續攻擊，再選擇精靈確認挑戰！</div>
                        </div>
                        <div>
                            <label class="block font-bold text-sm text-slate-300 mb-2">選擇出戰精靈</label>
                            <select id="selected-pet" class="w-full p-3 bg-slate-950 border-2 border-slate-800 rounded-xl font-bold text-white">
                                ${session.companions.map((c, i) => `<option value="${i}">${getCompanionName(c.type, c.exp, session.username)} (經驗值: ${c.exp})</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="fightBoss(${levelIdx})" class="w-full py-3.5 bg-gradient-to-r from-red-600 to-amber-600 text-white font-black rounded-2xl shadow-lg">確認判定挑戰結果</button>
                        <button onclick="document.getElementById('boss-modal').innerHTML=''" class="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl">離開房間</button>
                    </div>
                </div>
            `;
            document.getElementById('boss-modal').innerHTML = html;
        }

        function clickBoss(levelIdx) {
            const container = document.getElementById('boss-container');
            container.innerHTML = renderBossSVG(levelIdx, 'normal');
            alert('攻擊命中 Boss！');
        }

        function fightBoss(levelIdx) {
            const session = DB.getSession();
            const petIdx = parseInt(document.getElementById('selected-pet').value);
            const pet = session.companions[petIdx];
            const bossHp = bossHpList[levelIdx];

            let win = false;
            if (pet.exp > bossHp) win = true;
            else if (pet.exp === bossHp) win = Math.random() < 0.5;
            else win = false;

            const container = document.getElementById('boss-container');
            if (container) {
                container.innerHTML = renderBossSVG(levelIdx, win ? 'dead' : 'giant');
            }

            setTimeout(() => {
                document.getElementById('boss-modal').innerHTML = '';
                if (win) {
                    session.points += 1000;
                    recordHistory(session, `挑戰城堡第 ${levelIdx + 1} 層 Boss 勝利獲得 1000 積分`);
                    DB.setSession(session);
                    updateUserInDB(session);
                    alert(`🎉 挑戰成功！擊敗第 ${levelIdx + 1} 層 Boss，獲得額外 1000 積分獎勵！`);
                } else {
                    recordHistory(session, `挑戰城堡第 ${levelIdx + 1} 層 Boss 失敗`);
                    alert(`❌ 挑戰失敗！Boss 變得巨大無比，您的精靈實力尚需提升！`);
                }
                render();
            }, 1200);
        }

        // --- 遊戲中心與沙盒 ---
        function renderLibrary() {
            const games = DB.getGames().filter(g => !g.isBanned);
            return `
                <div class="space-y-6">
                    <h1 class="text-4xl font-black text-white">🎮 遊戲中心</h1>
                    <div class="grid md:grid-cols-3 gap-6">
                        ${games.length === 0 ? '<p class="text-slate-400 font-bold">目前沒有可遊玩的遊戲</p>' : ''}
                        ${games.map(g => `
                            <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border-4 border-pink-500/30 flex flex-col justify-between">
                                <div>
                                    <div class="h-44 bg-slate-950 rounded-2xl mb-4 flex items-center justify-center overflow-hidden font-black text-slate-400">
                                        ${g.thumb ? `<img src="${g.thumb}" class="w-full h-full object-cover">` : '遊戲預覽圖'}
                                    </div>
                                    <h3 class="text-2xl font-black text-white">${g.title}</h3>
                                    <p class="text-slate-400 font-bold text-sm mt-1">遊玩次數：${g.playCount}</p>
                                </div>
                                <button onclick="playGame(${g.id})" class="mt-6 py-3 bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black rounded-2xl hover:opacity-95 transition shadow-md">進入遊戲</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function playGame(id) {
            const games = DB.getGames();
            const g = games.find(x => x.id === id);
            const session = DB.getSession();
            if (g && !g.isBanned) {
                g.playCount++;
                DB.saveGames(games);
                recordHistory(session, `遊玩遊戲: ${g.title}`);
                updateUserInDB(session);
                activeGame = g;
                currentView = 'playgame';
                render();
            }
        }

        function renderPlayGame() {
            const blob = new Blob([activeGame.html_content || activeGame.html], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            return `
                <div class="space-y-4">
                    <button onclick="currentView='library'; render();" class="px-5 py-2.5 bg-slate-800 text-white font-black rounded-xl shadow-md hover:bg-slate-700 transition">⬅ 返回遊戲中心</button>
                    <div class="bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-pink-500/40">
                        <iframe sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals" src="${blobUrl}" class="w-full h-[700px] border-none"></iframe>
                    </div>
                </div>
            `;
        }

        // --- 徽章系統計算 ---
        function getUserBadges(user, allGamesCount) {
            let badges = [];
            const historyActions = (user.history || []).map(h => h.action);
            const playedAll = allGamesCount > 0 && DB.getGames().every(g => historyActions.some(act => act.includes(g.title)));
            if (playedAll || user.role === 'admin') badges.push({ name: '遊戲大師', desc: '玩過所有遊戲' });

            const users = DB.getUsers().filter(u => u.role === 'student');
            const ranked = users.map(u => {
                const comps = u.companions || [];
                let s = comps.length === 1 ? comps[0].exp : comps.reduce((acc, c) => acc + c.exp, 0) + comps.length * 10000;
                return { id: u.id, s };
            }).sort((a,b) => b.s - a.s);
            const top10Ids = ranked.slice(0, 10).map(x => x.id);
            if (top10Ids.includes(user.id) || user.role === 'admin') badges.push({ name: '精靈大師', desc: '排行榜前 10 名' });

            if ((user.companions || []).length >= 5 || user.role === 'admin') badges.push({ name: '精靈收藏家', desc: '擁全 5 種精靈' });

            if ((user.inventory || []).length >= 6 || user.role === 'admin') badges.push({ name: '變裝達人', desc: '擁有 6 件以上服飾' });

            if ((user.friends || []).length >= 20 || user.role === 'admin') badges.push({ name: '友善大使', desc: '擁有 20 位以上好友' });

            return badges;
        }

        function renderHomeland(session) {
            const bgObj = session.background ? getStoreItemObject(session.background) : null;

            const badges = getUserBadges(session, DB.getGames().length);

            return `
                <div class="grid md:grid-cols-2 gap-8">
                    <div class="relative overflow-hidden p-8 rounded-3xl shadow-xl border-4 border-emerald-500/30 text-center space-y-6 bg-slate-900/90">
                        ${bgSvg ? `<div class="absolute inset-0 opacity-40 z-0 pointer-events-none">${bgSvg}</div>` : ''}
                        <div class="relative z-10 space-y-6">
                            <h2 class="text-3xl font-black text-white">🏡 個人檔案與徽章</h2>
                            <div class="p-8 bg-slate-950/60 backdrop-blur-md rounded-3xl border-2 border-purple-500/30 shadow-inner">
                                ${renderAvatarSVG(session.gender, session.equipped)}

                            <div class="text-2xl font-black text-white">${session.username}</div>
                            
                            <div class="p-4 bg-slate-950/80 rounded-2xl border border-slate-800">
                                <div class="font-black text-amber-400 mb-2">🏅 我的成就徽章</div>
                                <div class="flex flex-wrap gap-2 justify-center">
                                    ${badges.length === 0 ? '<span class="text-xs text-slate-500 font-bold">尚無解鎖徽章</span>' : ''}
                                    ${badges.map(b => `<span class="px-3 py-1 bg-amber-950 text-amber-200 border border-amber-500/40 rounded-full text-xs font-bold" title="${b.desc}">${b.name}</span>`).join('')}
                                </div>
                            </div>

                            <button onclick="renderWardrobeModal()" class="w-full py-3.5 bg-pink-600 text-white font-black rounded-2xl shadow-lg hover:bg-pink-700 transition">管理衣櫥 (穿搭 / 脫下)</button>
                        </div>
                    </div>
                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-emerald-500/30 space-y-6">
                        <h2 class="text-3xl font-black text-white">🐾 精靈養成系統</h2>
                        <div class="grid grid-cols-1 gap-6">
                            ${session.companions.map((c, idx) => `

                                                <span class="text-xs text-slate-400 font-bold">(1-10000點)</span>
                                            </div>

        function trainPet(idx) {
            const session = DB.getSession();
            if (session.isBannedPoints) { alert('您的積分功能已被禁分，無法培養！'); return; }
            const amount = parseInt(document.getElementById(`train-${idx}`).value) || 1;
            if (amount < 1 || amount > 10000) { alert('每次培養點數必須在 1 到 10000 之間！'); return; }
            if (session.points < amount) { alert('點數不足！'); return; }
            session.points -= amount;
            session.companions[idx].exp += amount;
            recordHistory(session, `培養精靈消耗 ${amount} 積分`);
            DB.setSession(session);
            updateUserInDB(session);
            render();
        }

        function buyWeapon(idx, weaponType) {
            const session = DB.getSession();
            if (session.isBannedPoints) { alert('您的積分功能已被禁分！'); return; }
            if (session.companions[idx].exp < 100001) { alert('精靈尚未達到最終形態，無法購買武器！'); return; }
            if (session.points < 10000) { alert('點數不足！需要 10000 積分'); return; }
            session.points -= 10000;
            session.companions[idx].weapon = weaponType;
            recordHistory(session, `花費 10000 積分購買精靈武器: ${weaponType}`);
            DB.setSession(session);
            updateUserInDB(session);
            alert('成功購買武器！');
            render();
        }

        function buyNewCompanion() {
            const session = DB.getSession();
            if (session.isBannedPoints) { alert('您的積分功能已被禁分，無法解鎖新精靈！'); return; }
            const costs = [0, 10000, 20000, 30000, 40000];
            const cost = costs[session.companions.length] || 50000;
            if (session.companions.length >= 5) { alert('已解鎖全部 5 種精靈！'); return; }
            if (session.points < cost) { alert(`點數不足！解鎖此精靈需要 ${cost} 點`); return; }
            session.points -= cost;
            const types = ['water', 'fire', 'grass', 'electricity', 'ice'];
            const ownedTypes = session.companions.map(c => c.type);
            const remainingTypes = types.filter(t => !ownedTypes.includes(t));

            const html = `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div class="bg-slate-900 p-8 rounded-3xl max-w-md w-full space-y-6 text-center shadow-2xl border-4 border-amber-500/40">
                        <h3 class="text-3xl font-black text-amber-400">🐾 選擇你想解鎖的新精靈</h3>
                        <div class="grid grid-cols-1 gap-3">
                            ${remainingTypes.map(t => `<button onclick="confirmBuyCompanion('${t}',${cost})" class="p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-black text-white hover:border-amber-500 transition">${t === 'water' ? '水屬性精靈' : t === 'fire' ? '火屬性精靈' : t === 'grass' ? '草屬性精靈' : t === 'electricity' ? '電屬性精靈' : '冰屬性精靈'}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('wardrobe-modal').innerHTML = html;
        }

        window.confirmBuyCompanion = function(type, cost) {
            const session = DB.getSession();
            session.companions.push({ type: type, exp: 1, weapon: null });
            recordHistory(session, `花費 ${cost} 積分解鎖新精靈 (${type})`);
            DB.setSession(session);
            updateUserInDB(session);
            document.getElementById('wardrobe-modal').innerHTML = '';
            alert('成功解鎖新精靈！');
            render();
        }

            if (session.inventory.includes(itemId)) { alert('您已擁有此商品！'); return; }
            if (session.role !== 'admin' && session.points < price) { alert('點數不足！'); return; }

            session.inventory.push(itemId);
            recordHistory(session, `購買商店商品 ID:${itemId}`);
            DB.setSession(session);
            updateUserInDB(session);
            alert('購買成功！已存入衣櫥');

        function renderRanking() {
            const users = DB.getUsers().filter(u => u.role === 'student');
            const rankedUsers = users.map(u => {
                const comps = u.companions || [];
                let totalScore = 0;
                if (comps.length === 1) {
                    totalScore = comps[0].exp;
                } else if (comps.length > 1) {
                    const sumExp = comps.reduce((acc, c) => acc + c.exp, 0);
                    const extraBonus = comps.length * 10000;
                    totalScore = sumExp + extraBonus;
                }
                return { ...u, totalScore };
            }).sort((a, b) => b.totalScore - a.totalScore).slice(0, 100);

            return `

                        ${rankedUsers.length === 0 ? '<p class="text-slate-400 font-bold">目前尚無玩家上榜</p>' : ''}
                        ${rankedUsers.map((u, index) => `
                            <div class="p-4 bg-slate-950/80 rounded-2xl border-2 border-slate-800 flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <span class="text-2xl font-black ${index === 0 ? 'text-yellow-400' : index === 1 ? 'text-slate-300' : index === 2 ? 'text-amber-600' : 'text-slate-500'}">#${index + 1}</span>

                                        <div class="text-xs text-slate-400 font-bold">擁有精靈數：${u.companions.length} 隻</div>

                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderFriends(session) {
            const users = DB.getUsers();
            const friendsList = session.friends || [];
            const friendRequests = session.friendRequests || [];

            return `
                <div class="space-y-6">
                    <h1 class="text-4xl font-black text-white">👥 好友系統</h1>
                    
                    ${friendRequests.length > 0 ? `
                        <div class="bg-amber-950/80 backdrop-blur-md p-6 rounded-3xl shadow-xl border-4 border-amber-500/40 space-y-4">
                            <h2 class="text-xl font-black text-amber-300">📬 待處理的好友請求 (${friendRequests.length})</h2>
                            <div class="space-y-3">

                                    return `

                                            <div class="flex gap-2">
                                                <button onclick="acceptFriendRequest(${sender.id})" class="px-4 py-2 bg-emerald-600 text-white font-black rounded-xl text-sm">接受</button>
                                                <button onclick="declineFriendRequest(${sender.id})" class="px-4 py-2 bg-red-600 text-white font-black rounded-xl text-sm">拒絕</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-cyan-500/30 space-y-6">
                        <div class="flex gap-4">
                            <input id="search-friend" type="text" placeholder="輸入玩家帳號搜尋" class="flex-1 p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold outline-none text-white">
                            <button onclick="searchPlayer()" class="px-8 bg-cyan-600 text-white font-black rounded-2xl shadow">搜尋</button>

                            <h2 class="text-2xl font-black mb-4 text-white">我的好友列表 (${friendsList.length} / 100)</h2>
                            <div class="grid md:grid-cols-2 gap-4">
                                ${friendsList.length === 0 ? '<p class="text-slate-400 font-bold">目前還沒有好友！</p>' : ''}
                                ${friendsList.map(fid => {
                                    const friendObj = users.find(x => x.id === fid);
                                    if (!friendObj) return '';
                                    return `
                                        <div class="p-4 bg-slate-950/80 rounded-2xl border-2 border-slate-800 flex justify-between items-center">
                                            <div class="flex items-center gap-3">

                            </div>
                        </div>
                    </div>
                </div>
            `;

        function searchPlayer() {
            const query = document.getElementById('search-friend').value;
            const session = DB.getSession();
            const users = DB.getUsers();
            const found = users.find(u => u.username === query);
            const res = document.getElementById('search-result');
            if (found) {
                if (found.id === session.id) {
                    res.innerHTML = '<div class="text-amber-400 font-bold mt-4">不能搜尋並加自己為好友喔！</div>';
                    return;
                }
                const isAlreadyFriend = (session.friends || []).includes(found.id);
                const hasRequested = (found.friendRequests || []).includes(session.id);
                res.innerHTML = `
                    <div class="p-6 bg-slate-950 rounded-2xl flex justify-between items-center mt-4 border-2 border-slate-800">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 ${found.isOnline ? 'bg-emerald-500' : 'bg-slate-600'} rounded-full inline-block"></span>
                            <div>
                                <div class="font-black text-xl text-white">${found.username}</div>
                                <div class="text-sm text-slate-400 font-bold">積分：${found.points} 點</div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="inspectProfile(${found.id})" class="px-5 py-2.5 bg-purple-600 text-white font-black rounded-xl shadow">查看主頁</button>
                            ${isAlreadyFriend ? '<span class="px-4 py-2 bg-emerald-950 text-emerald-200 font-bold rounded-xl flex items-center">已是好友</span>' : hasRequested ? '<span class="px-4 py-2 bg-amber-950 text-amber-200 font-bold rounded-xl flex items-center">已發送請求</span>' : `<button onclick="sendFriendRequest(${found.id})" class="px-5 py-2.5 bg-cyan-600 text-white font-black rounded-xl shadow">發送好友請求</button>`}
                        </div>
                    </div>
                `;
            } else {
                res.innerHTML = '<div class="text-slate-400 font-bold mt-4">找不到此玩家</div>';
            }
        }

        function sendFriendRequest(id) {
            let users = DB.getUsers();
            const target = users.find(x => x.id === id);
            const session = DB.getSession();
            if (target) {
                if (!target.friendRequests) target.friendRequests = [];
                if (!target.friendRequests.includes(session.id)) {
                    target.friendRequests.push(session.id);
                    DB.saveUsers(users);
                    alert('好友請求已發送，等待對方登入接受！');
                    render();
                }
            }
        }

        function acceptFriendRequest(senderId) {
            let users = DB.getUsers();
            let session = DB.getSession();
            const sender = users.find(x => x.id === senderId);
            
            if (!session.friends) session.friends = [];
            if (!session.friends.includes(senderId)) session.friends.push(senderId);
            session.friendRequests = (session.friendRequests || []).filter(x => x !== senderId);

            if (sender) {
                if (!sender.friends) sender.friends = [];
                if (!sender.friends.includes(session.id)) sender.friends.push(session.id);
            }

            DB.setSession(session);
            DB.saveUsers(users);
            alert('已接受好友請求！');
            render();
        }

        function declineFriendRequest(senderId) {
            let session = DB.getSession();
            session.friendRequests = (session.friendRequests || []).filter(x => x !== senderId);
            DB.setSession(session);
            updateUserInDB(session);
            alert('已拒絕好友請求。');
            render();
        }

        function removeFriend(id) {
            if (confirm('確定要刪除這位好友嗎？')) {
                let session = DB.getSession();
                session.friends = (session.friends || []).filter(x => x !== id);
                recordHistory(session, `取消好友 ID:${id}`);
                DB.setSession(session);
                updateUserInDB(session);
                render();
            }
        }

                                    <div class="flex gap-2">
                                        <button onclick="approveRegistration(${p.id})" class="px-4 py-2 bg-emerald-600 text-white font-black rounded-xl text-sm">允許</button>
                                        <button onclick="declineRegistration(${p.id})" class="px-4 py-2 bg-red-600 text-white font-black rounded-xl text-sm">拒絕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-red-500/30 space-y-6">
                        <h2 class="text-2xl font-black text-white">建立與發布遊戲 (HTML/JS 原始碼)</h2>
                        <input id="game-title" type="text" placeholder="遊戲標題" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold outline-none text-white">
                        
                        <div class="space-y-2">
                            <label class="block font-bold text-sm text-slate-300">遊戲縮圖 (可貼上外部圖片網址 URL，或上傳本機圖片檔案)</label>
                            <input id="game-thumb-url" type="text" placeholder="貼上外部圖片網址 (https://...)" class="w-full p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold outline-none text-white">
                            <input type="file" id="game-thumb-file" class="w-full p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl font-bold text-white text-sm">
                        </div>

                        <textarea id="game-code" placeholder="在此貼上完整的 HTML/JavaScript 程式碼 (可支援外部圖片背景)..." class="w-full h-48 p-4 bg-slate-950 border-2 border-slate-800 rounded-2xl font-mono text-sm outline-none text-white"></textarea>
                        <button onclick="publishGame()" class="py-4 px-8 bg-red-600 text-white font-black rounded-2xl shadow-lg">立即發布到遊戲中心</button>

                        <h3 class="text-xl font-black text-white pt-4 border-t border-slate-800">現有遊戲管理 (封禁/刪除)</h3>
                        <div class="space-y-3">
                            ${games.map(g => `
                                <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div>
                                        <div class="font-black text-white">${g.title} ${g.isBanned ? '<span class="text-red-500 text-xs">(已封禁)</span>' : ''}</div>
                                        <div class="text-xs text-slate-400">遊玩次數: ${g.playCount}</div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="toggleBanGame(${g.id})" class="px-4 py-2 ${g.isBanned ? 'bg-emerald-600' : 'bg-amber-600'} text-white font-black rounded-xl text-sm">${g.isBanned ? '解除封禁' : '封禁遊戲'}</button>
                                        <button onclick="deleteGame(${g.id})" class="px-4 py-2 bg-red-600 text-white font-black rounded-xl text-sm">刪除遊戲</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-900/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border-4 border-red-500/30 space-y-6">
                        <h2 class="text-2xl font-black text-white">玩家帳號管理、歷史記錄與禁分控制</h2>
                        <div class="space-y-4">
                            ${users.filter(u => u.role === 'student').map(u => `
                                <div class="p-5 bg-slate-950/80 rounded-2xl border-2 border-slate-800 space-y-4">
                                    <div class="flex items-center justify-between flex-wrap gap-4">
                                        <div class="flex items-center gap-3">
                                            <input type="text" id="uname-${u.id}" value="${u.username}" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl font-bold text-white">
                                            <button onclick="adminUpdateUser(${u.id})" class="px-4 py-2.5 bg-blue-600 text-white font-black rounded-xl text-sm">更新帳號</button>
                                        </div>
                                        <div class="font-black text-amber-400">⭐ ${u.points} 點</div>
                                        <div class="flex gap-2 items-center">
                                            <input type="number" id="pts-${u.id}" placeholder="派發點數" class="w-24 p-2.5 bg-slate-900 border border-slate-800 rounded-xl font-bold text-white">
                                            <button onclick="adminAddPoints(${u.id})" class="px-4 py-2.5 bg-amber-500 text-slate-950 font-black rounded-xl text-sm">派點</button>
                                            <button onclick="toggleBanPoints(${u.id})" class="px-4 py-2.5 ${u.isBannedPoints ? 'bg-emerald-600' : 'bg-orange-600'} text-white font-black rounded-xl text-sm">${u.isBannedPoints ? '解除禁分' : '禁分'}</button>
                                            <button onclick="adminDeleteUser(${u.id}, '${u.username}')" class="px-4 py-2.5 bg-red-600 text-white font-black rounded-xl text-sm">刪除帳號</button>
                                        </div>
                                    </div>
                                    <details class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                        <summary class="font-black text-pink-400 cursor-pointer">檢視玩家操作歷史記錄 (${(u.history || []).length} 筆)</summary>
                                        <div class="mt-3 max-h-40 overflow-y-auto space-y-1 text-xs font-bold text-slate-300">
                                            ${(u.history || []).length === 0 ? '<p>尚無操作記錄</p>' : ''}
                                            ${(u.history || []).map(h => `<div>[${h.time}] ${h.action}</div>`).join('')}
                                        </div>
                                    </details>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function approveRegistration(id) {
            let pending = DB.getPending();
            const p = pending.find(x => x.id === id);
            if (p) {
                let users = DB.getUsers();
                const newUser = {
                    id: Date.now(), username: p.username, password: p.password, role: 'student', points: 100,
                    gender: p.gender, companions: [{ type: p.companionType, exp: 1, weapon: null }], inventory: [], equipped: {}, background: '', friends: [], friendRequests: [], history: [{ time: new Date().toLocaleString(), action: '註冊審核通過獲得 100 積分與初始精靈' }], isBannedPoints: false, dailyEarned: 0, lastEarnDate: '', isOnline: false
                };
                users.push(newUser);
                DB.saveUsers(users);
                pending = pending.filter(x => x.id !== id);
                DB.savePending(pending);
                alert('已允許該玩家註冊！');
                render();
            }
        }

        function declineRegistration(id) {
            let pending = DB.getPending();
            pending = pending.filter(x => x.id !== id);
            DB.savePending(pending);
            alert('已拒絕該玩家註冊申請。');
            render();
        }

        function toggleBanGame(id) {
            let games = DB.getGames();
            const g = games.find(x => x.id === id);
            if (g) {
                g.isBanned = !g.isBanned;
                DB.saveGames(games);
                alert(g.isBanned ? '遊戲已封禁！' : '遊戲已解除封禁！');
                render();
            }
        }

        function deleteGame(id) {
            if (confirm('確定要刪除此遊戲嗎？')) {
                let games = DB.getGames();
                games = games.filter(x => x.id !== id);
                DB.saveGames(games);
                alert('遊戲已刪除！');
                render();
            }
        }

        function publishGame() {
            const title = document.getElementById('game-title').value;
            const code = document.getElementById('game-code').value;
            const urlInput = document.getElementById('game-thumb-url').value.trim();
            const fileInput = document.getElementById('game-thumb-file');
            
            if (!title || !code) { alert('請填寫完整遊戲標題與原始碼！'); return; }

            const saveAndPublish = (thumbUrl) => {
                const games = DB.getGames();
                games.push({ id: Date.now(), title, html_content: code, thumb: thumbUrl || '', playCount: 0, isBanned: false });
                DB.saveGames(games);
                alert('遊戲發布成功！');
                render();
            };

            if (urlInput) {
                saveAndPublish(urlInput);
            } else if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveAndPublish(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveAndPublish('');
            }
        }

        function adminAddPoints(userId) {
            const amount = parseInt(document.getElementById(`pts-${userId}`).value) || 0;
            const users = DB.getUsers();
            const u = users.find(x => x.id === userId);
            if (u) {
                u.points += amount;
                recordHistory(u, `管理員派發 ${amount} 積分`);
                DB.saveUsers(users);
                alert('派點成功！');
                render();
            }
        }

        function toggleBanPoints(userId) {
            const users = DB.getUsers();
            const u = users.find(x => x.id === userId);
            if (u) {
                u.isBannedPoints = !u.isBannedPoints;
                recordHistory(u, u.isBannedPoints ? '管理員已封禁其積分功能' : '管理員已解除積分封禁');
                DB.saveUsers(users);
                alert(u.isBannedPoints ? '已成功禁分！' : '已解除禁分！');
                render();
            }
        }

        function adminUpdateUser(userId) {
            const newName = document.getElementById(`uname-${userId}`).value;
            if (!newName || !/^[A-Za-z0-9]+$/.test(newName)) { alert('帳號名稱僅限英文與數字！'); return; }
            const users = DB.getUsers();
            if (users.some(x => x.username === newName && x.id !== userId)) { alert('此帳號名稱已被使用！'); return; }
            const u = users.find(x => x.id === userId);
            if (u) {
                recordHistory(u, `管理員將帳號名稱從 ${u.username} 改為 ${newName}`);
                u.username = newName;
                DB.saveUsers(users);
                alert('帳號名稱更新成功！');
                render();
            }
        }

        function adminDeleteUser(userId, username) {
            if (confirm(`【警告】確定要永久刪除玩家帳號「${username}」嗎？此操作將無法復原！`)) {
                if (confirm(`請再次確認：您真的要刪除 ${username} 的所有資料嗎？`)) {
                    let users = DB.getUsers();
                    users = users.filter(x => x.id !== userId);
                    DB.saveUsers(users);
                    alert('玩家帳號已成功刪除。');
                    render();
                }
            }
        }

        function updateUserInDB(sessionUser) {
            const users = DB.getUsers();
            if (sessionUser.role === 'admin' || sessionUser.username === 'adminamy') {
                sessionUser.points = 999999;
            }
            const idx = users.findIndex(x => x.id === sessionUser.id);
            if (idx !== -1) { users[idx] = sessionUser; DB.saveUsers(users); }
        }

        render();
    </script>
</body>
</html>
